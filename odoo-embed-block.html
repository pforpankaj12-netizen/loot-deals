<!-- Loot Ka Bhandara — LIVE DEALS FEED v2 (Odoo Embed Code block)
     Paste this whole block into an "Embed Code" block on
     https://www.lootkabhandara.com/today-s-deals, REPLACING the manual
     deals list below the blog-feed block. Do NOT put it inside the
     blog-feed block. Odoo does not strip plain div / style / script
     embed blocks (proven by the blog-feed block, 12 Nov 2026).
     Before publishing, replace FEED_URL with the real GitHub Pages URL.
     No other change is needed: the script fetches deals.json and
     renders the hero + tabs + cards itself.
     Design v2 (12 Nov 2026, ideas borrowed from DesiDime /
     Slickdeals / HotUKDeals, adapted to what our feed actually has):
     - "Deal of the Day" hero = biggest % off deal, featured large
     - category tabs with per-category accent colours + counts
     - sort: Newest / Biggest discount / Lowest price
     - store filter chips + live search box
     - cards show "You save ₹X", "posted 2h ago", NEW badge (<2h),
       HOT flame (>=70% off) — all from real feed fields only -->
<div id="loot-live-deals">
  <p class="lld-loading">Latest deals are loading — check Telegram @LootKaBhandara</p>
</div>
<style>
  #loot-live-deals { font-family: inherit; }
  #loot-live-deals .lld-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 12px; margin-bottom: 12px; }
  #loot-live-deals .lld-head h3 { font-size: 1.35rem; font-weight: 800; margin: 0; }
  #loot-live-deals .lld-updated { color: #777; font-size: 0.85rem; }
  /* ---- hero: deal of the day ---- */
  #loot-live-deals .lld-hero { display: flex; gap: 0; border-radius: 18px; overflow: hidden; background: linear-gradient(135deg, #FFF7ED, #FEF3C7); border: 1px solid #FDE68A; box-shadow: 0 4px 18px rgba(234,88,12,.15); margin-bottom: 16px; animation: lldFade .35s ease; }
  #loot-live-deals .lld-hero-media { position: relative; flex: 0 0 42%; min-height: 180px; }
  #loot-live-deals .lld-hero-media img, #loot-live-deals .lld-hero-media .lld-noimg { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }
  #loot-live-deals .lld-hero-media .lld-noimg { background: linear-gradient(135deg, #FFF7ED, #FDE68A); color: #B45309; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  #loot-live-deals .lld-hero-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  #loot-live-deals .lld-hero-tag { display: inline-block; align-self: flex-start; background: linear-gradient(135deg, #F97316, #DC2626); color: #fff; font-weight: 800; font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; }
  #loot-live-deals .lld-hero-title { font-size: 1.15rem; font-weight: 800; line-height: 1.3; }
  #loot-live-deals .lld-hero-price { font-size: 1.5rem; font-weight: 800; }
  #loot-live-deals .lld-hero-save { color: #15803D; font-weight: 700; font-size: 0.95rem; }
  /* ---- controls: sort + search ---- */
  #loot-live-deals .lld-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; }
  #loot-live-deals .lld-sort { border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 0.9rem; background: #fff; color: #444; }
  #loot-live-deals .lld-search { flex: 1 1 160px; border: 1.5px solid #e5e5e5; border-radius: 999px; padding: 8px 14px; font-size: 0.9rem; min-width: 140px; }
  #loot-live-deals .lld-search:focus { outline: none; border-color: #EA580C; }
  /* ---- store chips ---- */
  #loot-live-deals .lld-stores { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  #loot-live-deals .lld-store-chip { border: 1px solid #e5e5e5; background: #F9FAFB; color: #555; font-weight: 600; font-size: 0.82rem; padding: 4px 11px; border-radius: 999px; cursor: pointer; transition: all .2s ease; }
  #loot-live-deals .lld-store-chip:hover { border-color: #EA580C; color: #EA580C; }
  #loot-live-deals .lld-store-chip.active { background: #111827; border-color: #111827; color: #fff; }
  /* ---- category tabs ---- */
  #loot-live-deals .lld-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; scrollbar-width: none; }
  #loot-live-deals .lld-tabs::-webkit-scrollbar { display: none; }
  #loot-live-deals .lld-tab { flex: 0 0 auto; border: 1.5px solid #e5e5e5; background: #fff; color: #444; font-weight: 700; font-size: 0.9rem; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: all .25s ease; }
  #loot-live-deals .lld-tab:hover { border-color: var(--c1, #EA580C); color: var(--c1, #EA580C); transform: translateY(-1px); }
  #loot-live-deals .lld-tab.active { border-color: transparent; color: #fff; background: linear-gradient(135deg, var(--c1, #EA580C), var(--c2, #DC2626)); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  #loot-live-deals .lld-tab .lld-count { opacity: .75; font-weight: 600; font-size: .8rem; margin-left: 4px; }
  /* ---- card grid ---- */
  #loot-live-deals .lld-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; animation: lldFade .35s ease; }
  @keyframes lldFade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  #loot-live-deals .lld-card { border: 1px solid #eee; border-radius: 16px; overflow: hidden; background: #fff; display: flex; flex-direction: column; box-shadow: 0 2px 10px rgba(0,0,0,.06); transition: transform .25s ease, box-shadow .25s ease; }
  #loot-live-deals .lld-card:hover { transform: translateY(-4px); box-shadow: 0 12px 26px rgba(0,0,0,.14); }
  #loot-live-deals .lld-card:hover .lld-img { transform: scale(1.05); }
  #loot-live-deals .lld-media { position: relative; overflow: hidden; }
  #loot-live-deals .lld-img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: linear-gradient(135deg, #FFF7ED, #FDE68A); display: block; transition: transform .35s ease; }
  #loot-live-deals .lld-noimg { width: 100%; aspect-ratio: 4 / 3; background: linear-gradient(135deg, #FFF7ED, #FDE68A); color: #B45309; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; }
  #loot-live-deals .lld-badge { position: absolute; top: 10px; left: 10px; background: linear-gradient(135deg, #F97316, #DC2626); color: #fff; font-weight: 800; font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; box-shadow: 0 2px 8px rgba(220,38,38,.4); }
  #loot-live-deals .lld-flag { position: absolute; top: 10px; right: 10px; font-weight: 800; font-size: 0.75rem; padding: 3px 8px; border-radius: 999px; }
  #loot-live-deals .lld-flag-new { background: #16A34A; color: #fff; }
  #loot-live-deals .lld-flag-hot { background: #111827; color: #FDE68A; }
  #loot-live-deals .lld-body { padding: 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  #loot-live-deals .lld-title { font-weight: 600; line-height: 1.35; }
  #loot-live-deals .lld-price { font-size: 1.2rem; font-weight: 800; }
  #loot-live-deals .lld-mrp { color: #777; font-size: 0.9rem; }
  #loot-live-deals .lld-mrp s { color: #999; }
  #loot-live-deals .lld-save { color: #15803D; font-weight: 700; font-size: 0.85rem; }
  #loot-live-deals .lld-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  #loot-live-deals .lld-store { display: inline-block; background: #F3F4F6; color: #555; font-size: 0.8rem; font-weight: 600; padding: 2px 9px; border-radius: 999px; }
  #loot-live-deals .lld-ago { color: #999; font-size: 0.8rem; }
  #loot-live-deals .lld-btn { margin-top: auto; display: inline-block; text-align: center; background: linear-gradient(135deg, #F97316, #DC2626); color: #fff !important; font-weight: 700; padding: 10px 14px; border-radius: 10px; text-decoration: none; transition: filter .2s ease, transform .2s ease; }
  #loot-live-deals .lld-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  #loot-live-deals .lld-trust { color: #777; font-size: 0.85rem; margin-top: 1rem; }
  #loot-live-deals .lld-empty { color: #555; }
  @media (max-width: 640px) {
    #loot-live-deals .lld-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    #loot-live-deals .lld-hero { flex-direction: column; }
    #loot-live-deals .lld-hero-media { flex: none; min-height: 0; aspect-ratio: 16 / 9; }
  }
</style>
<script>
(function () {
  // TODO (Phase 2): replace with the real GitHub Pages URL, e.g.
  // https://pforpankaj12-netizen.github.io/loot-deals/deals.json
  var FEED_URL = 'https://<github-user>.github.io/loot-deals/deals.json';
  // Same order as the blog categoriser (blog/generate_category_draft.py).
  var ORDER = ['Smartphone & Mobile', 'Kitchen', 'Home & Appliances', 'Electronics', 'Fashion', 'Jewellery', 'Beauty & Personal Care', 'Grocery & Food', 'Other'];
  // One accent pair per category — tabs + active gradients use these.
  var COLORS = {
    'Smartphone & Mobile': ['#2563EB', '#7C3AED'],
    'Kitchen': ['#EA580C', '#F59E0B'],
    'Home & Appliances': ['#0D9488', '#059669'],
    'Electronics': ['#4F46E5', '#2563EB'],
    'Fashion': ['#DB2777', '#9333EA'],
    'Jewellery': ['#B45309', '#D97706'],
    'Beauty & Personal Care': ['#E11D48', '#F472B6'],
    'Grocery & Food': ['#65A30D', '#16A34A'],
    'Other': ['#EA580C', '#DC2626']
  };
  var root = document.getElementById('loot-live-deals');
  if (!root) return;

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function inr(n) {
    var v = Number(n);
    if (!isFinite(v)) return '';
    return '\u20B9' + Math.round(v).toLocaleString('en-IN');
  }
  function showMsg(html) {
    root.innerHTML = '<p class="lld-empty">' + html + '</p>';
  }
  function fmtUpdated(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return d.toLocaleString('en-IN', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  }
  function ago(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    var mins = Math.max(0, Math.round((Date.now() - d.getTime()) / 60000));
    if (mins < 60) return mins <= 1 ? 'just now' : mins + 'm ago';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + 'h ago';
    return Math.round(hrs / 24) + 'd ago';
  }
  function isNew(iso) {
    if (!iso) return false;
    var d = new Date(iso);
    return !isNaN(d.getTime()) && (Date.now() - d.getTime()) < 2 * 3600 * 1000;
  }
  function mediaHtml(d) {
    if (d.image) {
      var src = d.image;
      try { src = new URL(src, FEED_URL).href; } catch (e) { /* keep as-is */ }
      return '<img class="lld-img" src="' + esc(src) + '" alt="" loading="lazy" onerror="this.outerHTML=\'<div class=&quot;lld-noimg&quot;>Loot Ka Bhandara</div>\'">';
    }
    return '<div class="lld-noimg">Loot Ka Bhandara</div>';
  }
  function flagsHtml(d) {
    var out = '';
    if (isNew(d.posted_at)) out += '<span class="lld-flag lld-flag-new">NEW</span>';
    else if (d.discount_pct != null && Number(d.discount_pct) >= 70) out += '<span class="lld-flag lld-flag-hot">\uD83D\uDD25 HOT</span>';
    return out;
  }

  var allDeals = [];
  var byCat = {};
  var stores = [];
  var activeTab = 'All';
  var activeStore = 'All';
  var sortMode = 'newest';
  var query = '';
  var updatedAt = '';
  var heroDeal = null;

  function filtered() {
    var list = activeTab === 'All' ? allDeals.slice() : (byCat[activeTab] || []).slice();
    if (activeStore !== 'All') list = list.filter(function (d) { return (d.store || '') === activeStore; });
    if (query) {
      var q = query.toLowerCase();
      list = list.filter(function (d) { return (d.title || '').toLowerCase().indexOf(q) >= 0; });
    }
    if (sortMode === 'discount') list.sort(function (a, b) { return (Number(b.discount_pct) || 0) - (Number(a.discount_pct) || 0); });
    else if (sortMode === 'price') list.sort(function (a, b) { return (Number(a.price) || 0) - (Number(b.price) || 0); });
    return list; // 'newest' keeps the feed's newest-first order
  }

  function cardHtml(d) {
    var badge = (d.discount_pct != null && Number(d.discount_pct) > 0)
      ? '<span class="lld-badge">' + esc(Math.round(Number(d.discount_pct))) + '% OFF</span>' : '';
    var mrp = (d.mrp != null && Number(d.mrp) > Number(d.price))
      ? ' <span class="lld-mrp"><s>' + esc(inr(d.mrp)) + '</s></span>' : '';
    var save = (d.saving != null && Number(d.saving) > 0)
      ? '<div class="lld-save">You save ' + esc(inr(d.saving)) + '</div>' : '';
    var posted = ago(d.posted_at);
    return '<div class="lld-card"><div class="lld-media">' + mediaHtml(d) + badge + flagsHtml(d) + '</div><div class="lld-body">'
      + '<div class="lld-title">' + esc(d.title) + '</div>'
      + '<div><span class="lld-price">' + esc(inr(d.price)) + '</span>' + mrp + '</div>'
      + save
      + '<div class="lld-meta"><span class="lld-store">' + esc(d.store || 'Loot Ka Bhandara') + '</span>' + (posted ? '<span class="lld-ago">' + esc(posted) + '</span>' : '') + '</div>'
      + '<a class="lld-btn" href="' + esc(d.link) + '" target="_blank" rel="noopener sponsored">Get Deal</a>'
      + '</div></div>';
  }

  function heroHtml(d) {
    var mrp = (d.mrp != null && Number(d.mrp) > Number(d.price))
      ? ' <span class="lld-mrp"><s>' + esc(inr(d.mrp)) + '</s></span>' : '';
    var save = (d.saving != null && Number(d.saving) > 0)
      ? '<div class="lld-hero-save">You save ' + esc(inr(d.saving)) + '</div>' : '';
    var badge = (d.discount_pct != null && Number(d.discount_pct) > 0)
      ? '<span class="lld-badge">' + esc(Math.round(Number(d.discount_pct))) + '% OFF</span>' : '';
    return '<div class="lld-hero"><div class="lld-hero-media">' + mediaHtml(d) + badge + '</div>'
      + '<div class="lld-hero-body"><span class="lld-hero-tag">\uD83D\uDD25 Deal of the Day</span>'
      + '<div class="lld-hero-title">' + esc(d.title) + '</div>'
      + '<div><span class="lld-hero-price">' + esc(inr(d.price)) + '</span>' + mrp + '</div>'
      + save
      + '<div class="lld-meta"><span class="lld-store">' + esc(d.store || 'Loot Ka Bhandara') + '</span>' + (ago(d.posted_at) ? '<span class="lld-ago">' + esc(ago(d.posted_at)) + '</span>' : '') + '</div>'
      + '<a class="lld-btn" href="' + esc(d.link) + '" target="_blank" rel="noopener sponsored">Get Deal</a>'
      + '</div></div>';
  }

  function render() {
    var tabs = '';
    var cats = ORDER.filter(function (c) { return byCat[c] && byCat[c].length; });
    var allColors = COLORS['Other'];
    tabs += '<button type="button" class="lld-tab' + (activeTab === 'All' ? ' active' : '') + '" data-cat="All" style="--c1:' + allColors[0] + ';--c2:' + allColors[1] + '">All<span class="lld-count">' + allDeals.length + '</span></button>';
    cats.forEach(function (cat) {
      var cc = COLORS[cat] || COLORS['Other'];
      tabs += '<button type="button" class="lld-tab' + (activeTab === cat ? ' active' : '') + '" data-cat="' + esc(cat) + '" style="--c1:' + cc[0] + ';--c2:' + cc[1] + '">' + esc(cat) + '<span class="lld-count">' + byCat[cat].length + '</span></button>';
    });
    var storeChips = '<button type="button" class="lld-store-chip' + (activeStore === 'All' ? ' active' : '') + '" data-store="All">All stores</button>';
    stores.forEach(function (s) {
      storeChips += '<button type="button" class="lld-store-chip' + (activeStore === s ? ' active' : '') + '" data-store="' + esc(s) + '">' + esc(s) + '</button>';
    });
    var list = filtered();
    var grid = list.length
      ? '<div class="lld-grid">' + list.map(cardHtml).join('') + '</div>'
      : '<p class="lld-empty">No deals match — try another tab, store or search.</p>';
    var upd = updatedAt ? '<span class="lld-updated">Updated ' + esc(fmtUpdated(updatedAt)) + '</span>' : '';
    root.innerHTML = '<div class="lld-head"><h3>\uD83D\uDD25 Live Deals</h3>' + upd + '</div>'
      + (heroDeal ? heroHtml(heroDeal) : '')
      + '<div class="lld-controls"><select class="lld-sort" aria-label="Sort deals">'
      + '<option value="newest"' + (sortMode === 'newest' ? ' selected' : '') + '>Newest first</option>'
      + '<option value="discount"' + (sortMode === 'discount' ? ' selected' : '') + '>Biggest discount</option>'
      + '<option value="price"' + (sortMode === 'price' ? ' selected' : '') + '>Lowest price</option>'
      + '</select><input class="lld-search" type="search" placeholder="Search deals…" value="' + esc(query) + '"></div>'
      + '<div class="lld-stores">' + storeChips + '</div>'
      + '<div class="lld-tabs" role="tablist">' + tabs + '</div>' + grid
      + '<p class="lld-trust">Price can change at checkout — verify before paying. Get the day\u2019s best deals first on Telegram: <a href="https://t.me/LootKaBhandara" target="_blank" rel="noopener">@LootKaBhandara</a></p>';
    var btns = root.querySelectorAll('.lld-tab');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { activeTab = this.getAttribute('data-cat'); render(); });
    }
    var chips = root.querySelectorAll('.lld-store-chip');
    for (var j = 0; j < chips.length; j++) {
      chips[j].addEventListener('click', function () { activeStore = this.getAttribute('data-store'); render(); });
    }
    var sel = root.querySelector('.lld-sort');
    sel.addEventListener('change', function () { sortMode = sel.value; render(); });
    var inp = root.querySelector('.lld-search');
    inp.addEventListener('input', function () {
      query = inp.value;
      var listNow = filtered();
      var gridEl = root.querySelector('.lld-grid, .lld-empty');
      if (gridEl) {
        var html = listNow.length
          ? '<div class="lld-grid">' + listNow.map(cardHtml).join('') + '</div>'
          : '<p class="lld-empty">No deals match — try another tab, store or search.</p>';
        gridEl.outerHTML = html;
      }
    });
  }

  fetch(FEED_URL, { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function (feed) {
      var deals = (feed && Array.isArray(feed.deals)) ? feed.deals : [];
      // Keep only entries with the fields a card needs; tolerate the rest.
      deals = deals.filter(function (d) { return d && d.title && d.link && d.price != null; });
      if (!deals.length) {
        showMsg('No live deals right now — check Telegram <a href="https://t.me/LootKaBhandara" target="_blank" rel="noopener">@LootKaBhandara</a>.');
        return;
      }
      updatedAt = feed.updated_at || '';
      allDeals = deals; // feed is newest-first
      byCat = {};
      var storeSet = {};
      deals.forEach(function (d) {
        var c = d.category || 'Other';
        if (ORDER.indexOf(c) < 0) c = 'Other';
        (byCat[c] = byCat[c] || []).push(d);
        if (d.store) storeSet[d.store] = true;
      });
      stores = Object.keys(storeSet).sort();
      heroDeal = null;
      var best = -1;
      deals.forEach(function (d) {
        var pct = Number(d.discount_pct) || 0;
        if (pct >= 60 && pct > best) { best = pct; heroDeal = d; }
      });
      render();
    })
    .catch(function () {
      showMsg('Latest deals are loading — check Telegram <a href="https://t.me/LootKaBhandara" target="_blank" rel="noopener">@LootKaBhandara</a>.');
    });
})();
</script>
